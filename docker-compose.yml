services:
  db:
    image: postgres:16
    container_name: text2sql_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: text2sql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d text2sql"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./app
    container_name: text2sql_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@db:5432/text2sql
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code

volumes:
  pgdata: